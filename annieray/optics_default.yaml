# Default optical surface properties for ANNIE materials.
#
# Material ID keys match the MaterialID enum in annieray/materials.py.
# Each entry defines how a photon interacts at the material boundary.
#
# model:
#   fresnel   — Snell's law + unpolarized Fresnel equations at
#               the water/material interface.  Transmission enters
#               the material; if is_sensitive=True the photon is
#               detected, otherwise it is absorbed.
#   reflect   — probability-based reflect/absorb with a mix of
#               specular and Lambertian (diffuse) reflection.
#   absorb    — photon is always terminated.
#
materials:

  UNKNOWN:
    model: absorb

  GLASS:
    model: fresnel
    refractive_index: 1.50
    is_sensitive: false

  PHOTOCATHODE:
    model: fresnel
    refractive_index: 1.50
    is_sensitive: true

  PVC:
    model: reflect
    reflectivity: 0.05
    diffuse_fraction: 0.50

  TEFLON:
    model: reflect
    reflectivity: 0.98
    diffuse_fraction: 0.80

  ACRYLIC:
    model: fresnel
    refractive_index: 1.49
    is_sensitive: false

  STEEL:
    model: reflect
    reflectivity: 0.30
    diffuse_fraction: 0.10

  BLACK_SHEET:
    model: reflect
    reflectivity: 0.02
    diffuse_fraction: 0.50
