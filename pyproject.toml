[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "annieray"
version = "0.1.0"
description = "GPU-accelerated ray tracer for ANNIE detector"
requires-python = ">=3.11"
dependencies = [
    "taichi>=1.7",
    "numpy>=1.24",
    "h5py>=3",
    "lxml>=5",
    "cadquery>=2",
    "pyyaml>=6",
]

[project.scripts]
annieray = "annieray.cli:main"

[tool.setuptools.packages.find]
include = ["annieray*"]
